<!DOCTYPE html>
<html>
<head>
    <title>Management Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .tiles { display: flex; gap: 20px; margin-bottom: 30px; }
        .tile { border: 1px solid #ccc; border-radius: 8px; padding: 16px; min-width: 180px; }
        .tile-label { font-size: 13px; color: #666; }
        .tile-value { font-size: 26px; font-weight: bold; margin-top: 6px; }
        .chart-container { max-width: 700px; height: 320px; }
    </style>
</head>
<body>
    <h1>Management Dashboard</h1>
    <p>Fiscal Year: {{ fiscal_year }}</p>

    <div class="tiles">
        <div class="tile">
            <div class="tile-label">Total Target</div>
            <div class="tile-value">₹{{ total_target|floatformat:0 }}</div>
        </div>
        <div class="tile">
            <div class="tile-label">Total Achievement</div>
            <div class="tile-value">₹{{ total_achievement|floatformat:0 }}</div>
        </div>
        <div class="tile">
            <div class="tile-label">Achieved</div>
            <div class="tile-value">{{ percent_achieved }}%</div>
        </div>
    </div>

    <h2>Monthly Target vs Achievement</h2>
    <div class="chart-container">
        <canvas id="trendChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('trendChart');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: {{ month_labels|safe }},
                datasets: [
                    {
                        label: 'Target',
                        data: {{ monthly_target|safe }},
                        borderColor: '#888',
                        borderDash: [4, 3],
                        pointRadius: 0,
                    },
                    {
                        label: 'Achievement',
                        data: {{ monthly_achievement|safe }},
                        borderColor: '#2a78d6',
                        borderWidth: 2,
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
            }
        });
    </script>
</body>
</html>
