<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Sales Dashboard{% endblock %}</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 0; color: #222; display: flex; min-height: 100vh; }

        /* Sidebar */
        #sidebar {
            width: 280px; background: #1a3a5c; color: white; padding: 16px;
            display: flex; flex-direction: column; gap: 20px; transition: width 0.2s ease;
            overflow: hidden; flex-shrink: 0;
        }
        #sidebar.collapsed { width: 50px; padding: 16px 8px; }
        #sidebar.collapsed .sb-content, #sidebar.collapsed .sb-title { display: none; }
        .sb-header { display: flex; justify-content: space-between; align-items: center; }
        .sb-title { font-weight: bold; font-size: 15px; white-space: nowrap; color: white; text-decoration: none;}
        .sb-title:hover {text-decoration: underline;}
        #sbToggle { background: none; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
        .sb-section-label { font-size: 11px; text-transform: uppercase; color: #a9c2da; margin-bottom: 6px; }
        .sb-link { display: block; padding: 8px 10px; border-radius: 4px; color: white; text-decoration: none; font-size: 14px; margin-bottom: 4px; white-space: nowrap; }
        .sb-link:hover, .sb-link.active { background: rgba(255,255,255,0.15); }

        /* Main content */
        #main { flex: 1; padding: 2px 16px; overflow-x: hidden; background: #fafbfc; }

        /* Shared component styles used across dashboard pages */
        .tiles { display: flex; gap: 20px; height: 50px ; margin-bottom: 0px; flex-wrap: wrap; }
        .tile { border: 1px solid #ccc; border-radius: 8px; padding: 4px 8px; min-width: 180px; flex: 1; background: white; }
        .tile-label { font-size: 12px; color: #666; }
        .tile-value { font-size: 28px; font-weight: bold; margin-top: 4px; }
        .chart-container {
            width: 100%; margin-bottom: 0px; position: relative;
            background: white; border: 1px solid #eee; border-radius: 4px; padding: 5px; 
        }
        .chart-container-row {height: 250px;}
        .chart-container-full {height: 350px;}
        .chart-row { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 5px;}
        .chart-row > div {flex: 2; min-width: 340px;}
        .chart-row > div.chart-col-small { flex: 1; min-width: 280px;}
        .state-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
        .state-tile {
            border: 1px solid #ccc; border-radius: 8px; padding: 4px 6px;
            text-align: left; cursor: pointer; background: white;
        }
        .state-tile:hover { background: #f0f0f0; }
        table.data-table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        table.data-table th, table.data-table td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 14px; }
        table.data-table th { background: #f5f5f5; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0px; flex-wrap: wrap; gap: 10px; }
        .page-header h1 {margin: 0; }
        .fy-badge { background: #1a3a5c; color: white; padding: 10px 14px; border-radius: 4px; font-weight: bold; font-size: 14px; white-space: nowrap; }
        .back-btn-bar {
            position: sticky; top: 0; z-index: 50;
            background: #fafbfc; padding: 12px 0; margin: -24px -32px 16px -32px;
            padding-left: 32px; padding-right: 32px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px; background: white; border: 1px solid #ccc;
            color: #333; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
        }
        .back-btn:hover { background: #f0f0f0; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div id="sidebar">
        <div class="sb-header">
            <a class="sb-title" href="{% url 'home' %}">Sales Dashboard</a>
            <button id="sbToggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">&#9776;</button>
        </div>
        <div class="sb-content">
            <div>
                <div class="sb-section-label">Views</div>
                <a class="sb-link" href="{% url 'management_dashboard' %}">Management Dashboard</a>
                <a class="sb-link" href="{% url 'meeting_all_india_target' %}">Meeting Mode (Target Review)</a>
            </div>
            {% block sidebar_extra %}{% endblock %}
        </div>
        <div style="margin-top: auto; font-size: 12px; color: #a9c2da;">
            {% if request.user.is_authenticated %}{{ request.user.username }}{% endif %}
        </div>
    </div>
    <div id="main">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
